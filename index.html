<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <main class="game_board">
      <dialog id="welcomeDialog">
        <div class="dialogMain">
          <div class="player">
            <h2>Player 1</h2>
            <input
              class="playerInput"
              id="playerOneInput"
              type="text"
              placeholder="Player 1 name"
            />
          </div>

          <div class="player">
            <h2>Player 2</h2>
            <input
              class="playerInput"
              id="playerTwoInput"
              type="text"
              placeholder="Player 2 name"
            />
          </div>
        </div>
        <form method="dialog" class="closeDialog">
          <button type="submit" id="closeWelcome">Confirm</button>
        </form>
      </dialog>
      <div class="game_board_container">
        <div class="game_board_item" id="tl"></div>
        <div class="game_board_item" id="tm"></div>
        <div class="game_board_item" id="tr"></div>
        <div class="game_board_item" id="ml"></div>
        <div class="game_board_item" id="mm"></div>
        <div class="game_board_item" id="mr"></div>
        <div class="game_board_item" id="bl"></div>
        <div class="game_board_item" id="bm"></div>
        <div class="game_board_item" id="br"></div>
      </div>
    </main>
    <script src="game.js" defer></script>
  </body>
</html>
