<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <main class="game_board">
      <div class="game_board_container">
        <div class="game_board_item" id="tl">
          <div class="x_mark_container">
            <div class="x_mark left_cross"></div>
            <div class="x_mark right_cross"></div>
          </div>
        </div>
        <div class="game_board_item" id="tm"><div class="o_mark"></div></div>
        <div class="game_board_item" id="tr"></div>
        <div class="game_board_item" id="ml"></div>
        <div class="game_board_item" id="mm"></div>
        <div class="game_board_item" id="mr"></div>
        <div class="game_board_item" id="bl"></div>
        <div class="game_board_item" id="bm"></div>
        <div class="game_board_item" id="br"></div>
      </div>
    </main>
    <script src="game.js" defer></script>
  </body>
</html>
